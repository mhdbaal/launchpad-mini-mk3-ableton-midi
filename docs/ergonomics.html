<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Launchpad Mini MK3 — Documentation des modes</title>
<style>
  :root {
    --bg: #15171a; --panel: #1f2226; --panel2: #262a2f;
    --border: #2e3338; --border-hi: #4a5158;
    --text: #d6dadd; --dim: #8a939a; --hi: #ffffff;
    --accent: #5dd39e; --accent-bg: #1a3a2e;
    --danger: #e63946; --warn: #f1c40f;
    --link: #7fb6ea;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { font: 14px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif;
         background: var(--bg); color: var(--text); margin: 0; }
  a { color: var(--link); }
  h1, h2, h3, h4 { color: var(--hi); }
  code, kbd { background: #0e1014; color: #c2e0ff; padding: 1px 6px;
              border-radius: 3px; font: 12px/1 "SF Mono", Menlo, monospace; }
  kbd { border: 1px solid var(--border-hi); }

  .app { display: grid; grid-template-columns: 280px 1fr;
         min-height: 100vh; }

  /* ---------------- Sidebar ---------------- */
  .sidebar { background: var(--panel); border-right: 1px solid var(--border);
             padding: 18px 0; overflow-y: auto; position: sticky; top: 0;
             height: 100vh; }
  .sidebar h2 { margin: 0 18px 12px; font-size: 13px;
                text-transform: uppercase; letter-spacing: .8px;
                color: var(--dim); font-weight: 600; }
  .sidebar .brand { padding: 0 18px 16px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
  .sidebar .brand h1 { font-size: 16px; margin: 0; }
  .sidebar .brand p { margin: 4px 0 0; font-size: 12px; color: var(--dim); }
  .mode-group { margin-bottom: 8px; }
  .mode-group .group-title { padding: 6px 18px 4px; font-size: 12px;
                              color: var(--dim); text-transform: uppercase;
                              letter-spacing: .6px; font-weight: 600; }
  .mode-btn { display: block; width: 100%; text-align: left;
              background: transparent; border: 0; color: var(--text);
              padding: 7px 18px 7px 28px; cursor: pointer; font: inherit;
              border-left: 3px solid transparent; }
  .mode-btn:hover { background: var(--panel2); }
  .mode-btn.active { background: var(--accent-bg); color: var(--hi);
                     border-left-color: var(--accent); font-weight: 600; }
  .mode-btn.disabled { color: #555; font-style: italic; }
  .mode-btn .sub { display: block; font-size: 11px; color: var(--dim);
                   margin-top: 2px; font-weight: 400; }

  /* ---------------- Main ---------------- */
  .main { padding: 30px 40px 60px; max-width: 1100px; }
  .main h1 { margin: 0 0 4px; font-size: 24px; }
  .main .crumb { color: var(--dim); font-size: 13px; margin-bottom: 14px; }
  .main .crumb .sep { opacity: .5; margin: 0 6px; }
  .row { display: grid; grid-template-columns: auto 1fr;
         gap: 28px; align-items: flex-start; margin-top: 14px; }
  .activation { background: var(--panel); padding: 12px 14px; border-radius: 6px;
                border-left: 3px solid var(--accent); margin: 6px 0 14px; }
  .activation strong { color: var(--hi); }

  /* ---------------- Launchpad rendering ---------------- */
  .lp-wrap { background: #0a0c0e; padding: 14px; border-radius: 14px;
             border: 1px solid var(--border); width: max-content; }
  .lp { display: grid; grid-template-columns: repeat(9, 44px);
        grid-template-rows: repeat(9, 44px); gap: 4px; }
  .pad { width: 44px; height: 44px; display: flex;
         align-items: center; justify-content: center;
         font-size: 9px; line-height: 1.05; font-weight: 600;
         border-radius: 5px; background: #14171a; border: 1px solid #1c2024;
         position: relative; cursor: default; user-select: none; padding: 2px;
         text-align: center; color: rgba(0,0,0,0.65); }
  .pad.round { border-radius: 50%; }
  .pad.empty { background: transparent; border: none; }
  .pad.off { background: #16181a; color: #444; border-color: #1c2024; }
  .pad.dark { color: rgba(255,255,255,0.78); text-shadow: 0 1px 1px rgba(0,0,0,0.4); }
  .pad .label { pointer-events: none; word-break: break-word; }
  .pad[data-tip]:hover::after {
    content: attr(data-tip); position: absolute; bottom: 110%; left: 50%;
    transform: translateX(-50%); background: #000; color: #fff; padding: 6px 10px;
    border-radius: 4px; font-size: 11px; white-space: nowrap; z-index: 10;
    border: 1px solid #555; pointer-events: none; font-weight: 400;
    max-width: 340px; white-space: normal; min-width: 120px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.6);
  }
  .pad[data-tip]:hover::before {
    content: ''; position: absolute; bottom: 102%; left: 50%;
    transform: translateX(-50%); border: 5px solid transparent;
    border-top-color: #555;
  }

  /* ---------------- Info side ---------------- */
  .info-side { min-width: 0; }
  .info-side h3 { margin: 24px 0 8px; font-size: 14px;
                  text-transform: uppercase; letter-spacing: .8px;
                  color: var(--dim); border-bottom: 1px solid var(--border);
                  padding-bottom: 6px; }
  .info-side h3:first-child { margin-top: 0; }
  .info-side p { margin: 6px 0; }
  .info-side ul { padding-left: 20px; margin: 6px 0; }
  .info-side li { margin: 5px 0; }
  .gestures { background: var(--panel); border-radius: 6px;
              border: 1px solid var(--border); overflow: hidden; }
  .gestures table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .gestures th, .gestures td { padding: 8px 12px; text-align: left;
                                 border-bottom: 1px solid var(--border);
                                 vertical-align: top; }
  .gestures th { background: var(--panel2); color: var(--hi);
                 font-weight: 600; font-size: 12px;
                 text-transform: uppercase; letter-spacing: .5px; }
  .gestures tr:last-child td { border-bottom: none; }
  .gestures td:first-child { white-space: nowrap; color: var(--accent);
                              font-weight: 600; font-family: "SF Mono", Menlo, monospace; font-size: 12px; }

  /* ---------------- Legend ---------------- */
  .legend { background: var(--panel); border-radius: 6px;
            border: 1px solid var(--border); padding: 14px 16px;
            margin-top: 16px; }
  .legend dl { display: grid; grid-template-columns: 110px 1fr;
               gap: 6px 14px; margin: 0; font-size: 13px; }
  .legend dt { font-weight: 600; color: var(--hi); }
  .legend dd { margin: 0; color: var(--dim); }
  .swatch { display: inline-block; width: 12px; height: 12px; border-radius: 3px;
            vertical-align: -2px; margin-right: 6px;
            border: 1px solid rgba(255,255,255,0.12); }

  .ergo-notes { margin-top: 28px; background: var(--panel);
                border-radius: 6px; border: 1px solid var(--border);
                padding: 16px 20px; }
  .ergo-notes h2 { margin: 0 0 12px; font-size: 16px; }
  .ergo-notes ol { padding-left: 22px; margin: 8px 0; }
  .ergo-notes li { margin: 10px 0; }
  .ergo-notes li strong { color: var(--hi); }
  .ergo-notes em { color: var(--warn); font-style: normal; }
  .tag { display: inline-block; background: var(--panel2);
         color: var(--dim); padding: 1px 7px; border-radius: 10px;
         font-size: 11px; border: 1px solid var(--border); }
  .tag.disabled { color: #6b3a3a; border-color: #3a1f1f;
                  background: rgba(60,20,20,0.4); }
  .tag.active { color: #2ecc71; border-color: #1e5a3a;
                background: rgba(20,60,40,0.4); }
</style>
</head>

<body>

    <div class="brand">
      <h1>Mini MK3 — modes</h1>

    </div>
    <div id="modeList"></div>
  </aside>

  <main class="main" id="main">
    <!-- Rendered by JS -->
  </main>
</div>

// ============================================================================
// LAYOUT BUILDERS — per mode, return cells = { "r,c": {color, label, tip} }
// ============================================================================

// Top row builders — drum/melodic vs session
function topRow(mode) {
  const cells = {};
  // Default: all off
  for (let c = 0; c < 8; c++) cells[`0,${c}`] = { color: C.off, label: TOP_BTN_NAMES[c], tip: TOP_BTN_NAMES[c], round: true };
  // Session button (idx 4)
  if (mode.startsWith('session')) {
    cells['0,4'] = { color: C.green, label: 'Session', tip: 'Session button — cycle launch ↔ overview', round: true };
  } else if (mode.startsWith('drum') || mode.startsWith('melodic')) {
    cells['0,4'] = { color: C.greenHalf, label: 'Session', tip: 'Session button (dim) — tap = latch session, hold = preview', round: true };
  }
  // Drums + Keys = transport
  cells['0,5'] = { color: C.greenHalf, label: 'Play', tip: 'Drums button = Play/Stop transport', round: true };
  cells['0,6'] = { color: C.redHalf, label: 'Rec', tip: 'Keys button = Session Record', round: true };
  // User
  if (mode === 'session-user') {
    cells['0,7'] = { color: C.white, label: 'User', tip: 'User tenu — affiche le mode selector', round: true };
  } else if (mode.startsWith('drum')) {
    cells['0,7'] = { color: C.amber, label: 'User', tip: 'User — drum sequencer actif', round: true };
  } else if (mode.startsWith('melodic')) {
    cells['0,7'] = { color: C.blue, label: 'User', tip: 'User — melodic sequencer actif', round: true };
  } else {
    cells['0,7'] = { color: C.off, label: 'User', tip: 'User — hold pour selector', round: true };
  }
  // Arrows
  if (mode.startsWith('drum')) {
    cells['0,0'] = { color: C.greenHalf, label: '↑', tip: 'Pitch +12 (ou Velocity +8 si step held)', round: true };
    cells['0,1'] = { color: C.greenHalf, label: '↓', tip: 'Pitch −12 (ou Velocity −8)', round: true };
    cells['0,2'] = { color: C.mint, label: '←', tip: 'Undo (ou Nudge −1 si step held)', round: true };
    cells['0,3'] = { color: C.mint, label: '→', tip: 'Redo (ou Nudge +1)', round: true };
  } else if (mode.startsWith('melodic')) {
    cells['0,0'] = { color: C.greenHalf, label: '↑', tip: 'Pitch +12 semitones', round: true };
    cells['0,1'] = { color: C.greenHalf, label: '↓', tip: 'Pitch −12', round: true };
    cells['0,2'] = { color: C.mint, label: '←', tip: 'Pitch −1 semitone', round: true };
    cells['0,3'] = { color: C.mint, label: '→', tip: 'Pitch +1', round: true };
  } else {
    // Session: navigation
    cells['0,0'] = { color: C.darkGrey, label: '↑', tip: 'Session nav up', round: true };
    cells['0,1'] = { color: C.darkGrey, label: '↓', tip: 'Session nav down', round: true };
    cells['0,2'] = { color: C.darkGrey, label: '←', tip: 'Session nav left', round: true };
    cells['0,3'] = { color: C.darkGrey, label: '→', tip: 'Session nav right', round: true };
  }
  cells['0,8'] = { empty: true };
  return cells;
}

// Scene column builders (col 8, rows 1-8)
function sceneCol(mode) {
  const cells = {};
  // Default
  for (let r = 1; r <= 8; r++) cells[`${r},8`] = { color: C.off, label: '', tip: `Scene ${r-1}`, round: true };

  if (mode === 'session-select') {
    for (let r = 1; r <= 7; r++) cells[`${r},8`] = { color: C.darkGrey, label: `Sc${r-1}`, tip: 'Launch scene', round: true };
    cells['8,8'] = { color: C.aqua, label: 'Shift', tip: 'Shift / Stop-Solo-Mute (mode select)', round: true };
  } else if (mode === 'session-edit') {
    for (let r = 1; r <= 7; r++) cells[`${r},8`] = { color: C.darkGrey, label: `Sc${r-1}`, tip: 'Scene (handler edit mode)', round: true };
    cells['8,8'] = { color: C.white, label: 'Shift', tip: 'Shift edit (tap = exit, hold + tap slot 7 = Redo)', round: true };
  } else if (mode === 'session-user') {
    cells['1,8'] = { color: C.amber, label: 'Drum', tip: 'Tap = enter Drum sequencer', round: true };
    cells['2,8'] = { color: C.off, label: '', tip: 'Drum 64 (désactivé)', round: true };
    cells['3,8'] = { color: C.off, label: '', tip: 'Drum 4-track (désactivé)', round: true };
    cells['4,8'] = { color: C.blue, label: 'Melo', tip: 'Tap = enter Melodic sequencer', round: true };
    cells['5,8'] = { color: C.off, label: '', tip: 'Chord (désactivé)', round: true };
    cells['6,8'] = { color: C.off, label: '', tip: '', round: true };
    cells['7,8'] = { color: C.off, label: '', tip: '', round: true };
    cells['8,8'] = { color: C.aqua, label: 'Shift', tip: 'Shift (untouched durant User held)', round: true };
  } else if (mode === 'session-copy') {
    for (let r = 1; r <= 7; r++) cells[`${r},8`] = { color: C.darkGrey, label: `Sc${r-1}`, tip: 'Scene (copy si shift tenu et tap)', round: true };
    cells['8,8'] = { color: C.aqua, label: 'Shift', tip: 'Hold shift = modifier copy', round: true };
  } else if (mode === 'session-stopsolomute') {
    for (let r = 1; r <= 7; r++) cells[`${r},8`] = { color: C.darkGrey, label: `Sc${r-1}`, tip: 'Scene', round: true };
    cells['8,8'] = { color: C.whiteHalf, label: 'Shift', tip: 'Cycle désactivé (un seul sub-mode)', round: true };
  } else if (mode.startsWith('drum')) {
    drumScene(cells, mode);
  } else if (mode.startsWith('melodic')) {
    melodicScene(cells, mode);
  }
  return cells;
}

function drumScene(cells, mode) {
  const special = mode === 'drum-special-delete' || mode === 'drum-special-dup';
  const isVel = mode === 'drum-velocity';
  if (special) {
    const isDel = mode === 'drum-special-delete';
    const half = isDel ? C.redHalf : C.greenHalf;
    const full = isDel ? C.red : C.green;
    cells['1,8'] = { color: half, label: 'Row 0', tip: `Row selector 0 (${isDel?'delete':'capture/copy'} row of selected pad, current page)`, round: true };
    cells['2,8'] = { color: half, label: 'Row 1', tip: 'Row selector 1', round: true };
    cells['3,8'] = { color: half, label: 'Row 2', tip: 'Row selector 2', round: true };
    cells['4,8'] = { color: half, label: 'Row 3', tip: 'Row selector 3', round: true };
    cells['5,8'] = { color: C.off, label: '', tip: 'inert pendant special shift', round: true };
    cells['6,8'] = { color: C.amber, label: 'Shift', tip: 'Sequencer shift (peut être tenu en même temps)', round: true };
    cells['7,8'] = { color: full, label: isDel?'DEL':'DUP', tip: 'Special Shift held — armed', round: true };
    cells['8,8'] = { color: C.off, label: 'Resv', tip: 'Reserved (session-only)', round: true };
  } else {
    cells['1,8'] = { color: C.greenHalf, label: 'Capt', tip: 'Capture MIDI (dim = nothing to capture ; vert plein si can_capture_midi)', round: true };
    cells['2,8'] = { color: C.aqua, label: 'Qtz', tip: 'Quantize selected (held steps ou all of selected pad)', round: true };
    cells['3,8'] = { color: C.yellowHalf, label: 'DupPg', tip: 'Duplicate Page modifier — hold + tap page', round: true };
    cells['4,8'] = { color: C.purple, label: 'Dbl', tip: 'Double Loop — tap = double length + copie contenu', round: true };
    cells['5,8'] = { color: mode === 'drum-grid' ? C.orange : C.aqua, label: 'Cycle', tip: `Cycle bottom-right loop ↔ grid (actuel: ${mode==='drum-grid'?'grid':'loop'})`, round: true };
    cells['6,8'] = { color: mode === 'drum-shift' ? C.amber : C.off, label: 'Shift', tip: mode==='drum-shift'?'Sequencer shift TENU':'Sequencer shift idle (hold = loop picker)', round: true };
    cells['7,8'] = { color: C.greenHalf, label: 'Spc', tip: 'Special Shift idle (mode = duplicate par défaut)', round: true };
    cells['8,8'] = { color: C.off, label: 'Resv', tip: 'Reserved (slot 8 / scene 7) — session-only', round: true };
  }
}

function melodicScene(cells, mode) {
  const shift = mode === 'melodic-shift';
  cells['1,8'] = { color: shift ? C.purple : C.greenHalf, label: shift ? 'Chrm' : 'Capt', tip: shift?'Chromatic toggle':'Capture MIDI', round: true };
  cells['2,8'] = { color: C.aqua, label: shift ? 'Scal' : 'Qtz', tip: shift?'Cycle scale':'Quantize', round: true };
  cells['3,8'] = { color: C.off, label: '', tip: 'free', round: true };
  cells['4,8'] = { color: C.off, label: '', tip: 'free', round: true };
  cells['5,8'] = { color: C.off, label: '', tip: 'free', round: true };
  cells['6,8'] = { color: mode === 'melodic-shift' ? C.mint : C.off, label: 'Shift', tip: 'Sequencer shift', round: true };
  cells['7,8'] = { color: mode === 'melodic-grid' ? C.orange : C.aqua, label: 'Cycle', tip: 'Cycle pitch ↔ grid', round: true };
  cells['8,8'] = { color: C.off, label: 'Resv', tip: 'Reserved', round: true };
}

// Pad grid builders (rows 1-8, cols 0-7)
function padGrid(mode) {
  const cells = {};
  for (let r = 1; r <= 8; r++)
    for (let c = 0; c < 8; c++)
      cells[`${r},${c}`] = padCell(mode, r-1, c);
  return cells;
}

function padCell(mode, padRow, padCol) {
  // padRow 0-7 (top to bottom), padCol 0-7
  if (mode.startsWith('session')) return sessionPad(mode, padRow, padCol);
  if (mode.startsWith('drum')) return drumPad(mode, padRow, padCol);
  if (mode.startsWith('melodic')) return melodicPad(mode, padRow, padCol);
  if (mode === 'drum-64' || mode === 'drum-4-track' || mode === 'chord-pad') return { color: C.off, label: '', tip: 'mode désactivé' };
  return { color: C.off, label: '', tip: '' };
}

function sessionPad(mode, r, c) {
  // Track select bottom row in select mode
  if (mode === 'session-select' && r === 7) {
    return { color: C.amber, label: `T${c}`, tip: `Track ${c} select / arm toggle` };
  }
  if (mode === 'session-edit' && r === 7) {
    const m = [['Del',C.red,'Delete (hold + tap clip/scene)'],
               ['Dup',C.green,'Duplicate (Ctrl+D style)'],
               ['Mov',C.blue,'Move (1st tap source, 2nd target)'],
               ['Col',C.yellow,'Color cycle'],
               ['Stop',C.darkOrange,'Stop All Clips (tap = instant)'],
               ['',C.off,'inert'],
               ['',C.off,'inert'],
               ['Undo',C.whiteHalf,'Undo (avec shift held = Redo)']];
    return { color: m[c][1], label: m[c][0], tip: m[c][2] };
  }
  if (mode === 'session-copy' && r === 7) {
    return { color: C.amber, label: `T${c}`, tip: `Track ${c} (copy gated tant que shift tenu)` };
  }
  // Mock clip grid
  const mockClips = [
    [C.greenHalf, C.blue, C.off, C.off, C.amber, C.off, C.off, C.off],
    [C.greenHalf, C.off, C.off, C.purple, C.off, C.off, C.off, C.off],
    [C.off, C.off, C.off, C.off, C.off, C.off, C.off, C.off],
  ];
  const color = (mockClips[r] && mockClips[r][c]) || C.off;
  let tip = `Clip slot (track ${c}, scene ${r})`;
  if (mode === 'session-user') tip += ' (gated par User held)';
  if (mode === 'session-edit') tip = `Clip slot — routé vers edit handler (delete/dup/move/color/...)`;
  return { color, label: '', tip };
}

function drumPad(mode, r, c) {
  const isShift = mode === 'drum-shift';
  const isGrid = mode === 'drum-grid';
  const isVel = mode === 'drum-velocity';
  const isSpecial = mode === 'drum-special-delete' || mode === 'drum-special-dup';
  const isSpecialDel = mode === 'drum-special-delete';
  const isSpecialDup = mode === 'drum-special-dup';

  // Step grid: top 4 rows
  if (r < 4) {
    const step = r * 8 + c;
    if (isShift) {
      // Loop range picker backdrop
      const inLoop = step < 16;
      return { color: inLoop ? C.lightBlue : C.lightBlueHalf, label: '', tip: `Step ${step} — tap = scope loop here (inside loop: ${inLoop})` };
    }
    // Base / Special / Vel / Grid
    const downbeat = step % 4 === 0;
    const mockNotes = [0, 4, 6, 10, 12, 16, 24];
    const hasNote = mockNotes.includes(step);
    if (step === 4 && isSpecialDup) {
      // simulate source blink on step
      return { color: C.amber, label: '★', tip: `Step ${step} — source captured (blink white)` };
    }
    let color;
    if (hasNote) color = C.amber;
    else color = downbeat ? C.blueHalf : C.darkBlueHalf;
    let tip = `Step ${step}`;
    if (isSpecialDel) tip = `Step ${step} — tap = delete this note`;
    else if (isSpecialDup) tip = `Step ${step} — tap source or target (cross-type resets)`;
    return { color, label: '', tip };
  }

  // Bottom-left 4×4 = drum pad selector
  if (r >= 4 && c < 4) {
    const padIdx = (r - 4) * 4 + c;
    const selected = padIdx === 0;
    const mockHasNotes = [0, 1, 4, 5, 8].includes(padIdx);
    const playing = padIdx === 4; // mock currently playing
    const rackColor = [C.red, C.orange, C.yellow, C.green, C.blue, C.purple, C.aqua, C.amber, C.mint, C.violet, C.darkOrange, C.paleGreen, C.lightBlue, C.cream, C.darkBlue, C.whiteHalf][padIdx];

    if (playing) return { color: C.green, label: '♪', tip: `Pad ${padIdx} (note en cours de jouer — flash vert)` };
    if (selected) return { color: C.amber, label: '✓', tip: `Pad ${padIdx} (selected — couleur ambre)` };
    if (isSpecial && !mockHasNotes) return { color: C.darkGrey, label: '', tip: `Pad ${padIdx} (empty — dim pendant special shift)` };
    if (isSpecialDup && padIdx === 1) return { color: rackColor, label: '★', tip: `Pad ${padIdx} — source captured (blink white)` };
    return { color: rackColor, label: '', tip: `Pad ${padIdx} ${mockHasNotes?'(has notes)':''}` };
  }

  // Bottom-right 4×4 = page selector / grid resolution
  if (r >= 4 && c >= 4) {
    const idx = (r - 4) * 4 + (c - 4);
    if (isGrid) {
      const labels = ['1/4','1/8','1/16','1/32','1/64','1/128','1/256','1/512','1/4t','1/8t','1/16t','1/32t','1/64t','1/128t','1/256t','1/512t'];
      const ternary = idx >= 8;
      const selected = idx === 2; // mock 1/16 selected
      if (selected) return { color: C.white, label: labels[idx], tip: `Grid: ${labels[idx]} (selected)` };
      return { color: ternary ? C.purple : C.orangeHalf, label: labels[idx], tip: `Grid: ${labels[idx]} (shift-gated)` };
    }
    if (isVel) {
      // Velocity overlay rampe
      const palette = [C.green, C.green, C.green, C.mint, C.mint, C.amber, C.amber, C.yellow, C.yellow, C.orange, C.orange, C.red, C.red, C.red, C.red, C.white];
      return { color: palette[idx], label: `${idx+1}`, tip: `Velocity level ${idx+1} — tap = set velocity` };
    }
    // Page selector
    const current = idx === 0;
    const insideLoop = idx < 4;
    let color, tip;
    if (isSpecialDup && idx === 2) return { color: C.lightBlue, label: '★', tip: `Page ${idx+1} — source captured (blink)` };
    if (current) { color = C.aqua; tip = `Page ${idx+1} (page courante)`; }
    else if (insideLoop) { color = C.lightBlueHalf; tip = `Page ${idx+1} (inside loop)`; }
    else { color = C.darkGrey; tip = `Page ${idx+1} (outside loop)`; }
    if (isSpecial) {
      const act = isSpecialDel ? 'wipe entire page (all pitchs)' : 'capture/copy page';
      tip = `Page ${idx+1} — tap = ${act}`;
    }
    return { color, label: '', tip };
  }
  return { color: C.off, label: '', tip: '' };
}

function melodicPad(mode, r, c) {
  const isShift = mode === 'melodic-shift';

  // Shift held: row 0 = page selector + preview toggle
  if (isShift && r === 0) {
    if (c === 7) return { color: C.amber, label: 'PRV', tip: 'Preview toggle ON (tap = piano roll mode)' };
    return { color: c < 4 ? C.aqua : C.darkGrey, label: `P${c+1}`, tip: `Page ${c+1} selector` };
  }
  // Row 7 = step grid (8 cols × 1 row)
  if (r === 7) {
    const downbeat = c % 4 === 0;
    return { color: downbeat ? C.blueHalf : C.darkBlueHalf, label: '', tip: `Step ${c}` };
  }
  // Other rows = pitch cells
  const isRoot = r === 6;
  const inScale = [0, 2, 4, 5].includes(c); // mock diatonic
  let color = isRoot ? C.amber : (inScale ? C.darkBlue : C.darkBlueHalf);
  // Mock a couple notes
  if ((r === 5 && c === 0) || (r === 3 && c === 4)) color = C.amber;
  return { color, label: '', tip: `Row ${r} / col ${c}` };
}

// ============================================================================
// RENDER
// ============================================================================
function buildCells(mode) {
  return Object.assign({}, topRow(mode), sceneCol(mode), padGrid(mode));
}

function brightness(hex) {
  hex = (hex || '').replace('#','');
  if (hex.length !== 6) return 0;
  const r = parseInt(hex.slice(0,2), 16);
  const g = parseInt(hex.slice(2,4), 16);
  const b = parseInt(hex.slice(4,6), 16);
  return (r*299 + g*587 + b*114) / 1000;
}

function renderMode(modeKey) {
  const info = MODE_INFO[modeKey];
  if (!info) return;
  const main = document.getElementById('main');
  const cells = buildCells(modeKey);

  // Build LP HTML
  let lpHtml = '<div class="lp-wrap"><div class="lp">';
  for (let r = 0; r < 9; r++) {
    for (let c = 0; c < 9; c++) {
      const cell = cells[`${r},${c}`] || { color: C.off };
      if (cell.empty) { lpHtml += '<div class="pad empty"></div>'; continue; }
      const classes = ['pad'];
      if (cell.round || r === 0 || c === 8) classes.push('round');
      if (cell.color === C.off) classes.push('off');
      if (brightness(cell.color) < 128) classes.push('dark');
      const bg = cell.color || C.off;
      const tip = (cell.tip || '').replace(/"/g, '&quot;');
      const lab = cell.label || '';
      lpHtml += `<div class="${classes.join(' ')}" style="background:${bg}" data-tip="${tip}"><div class="label">${lab}</div></div>`;
    }
  }
  lpHtml += '</div></div>';

  // Build content
  const descHtml = info.description.map(p => `<p>${p}</p>`).join('');
  const gesturesHtml = info.gestures.length
    ? `<table><thead><tr><th>Geste</th><th>Effet</th></tr></thead><tbody>${
        info.gestures.map(g => `<tr><td>${g[0]}</td><td>${g[1]}</td></tr>`).join('')
      }</tbody></table>`
    : '<p style="color:var(--dim)">(pas de geste — mode contextuel ou désactivé)</p>';
  const notesHtml = info.notes.length
    ? `<ul>${info.notes.map(n => `<li>${n}</li>`).join('')}</ul>`
    : '<p style="color:var(--dim)">Pas d\'observation spécifique.</p>';

  main.innerHTML = `
    <div class="crumb">${info.group} <span class="sep">›</span> ${info.title.split(' — ').slice(1).join(' — ') || info.title}</div>
    <h1>${info.title}</h1>
    <div class="activation"><strong>Activation —</strong> ${info.activation}</div>
    <div class="row">
      ${lpHtml}
      <div class="info-side">
        <h3>Description</h3>
        ${descHtml}
        <h3>Gestes & effets</h3>
        <div class="gestures">${gesturesHtml}</div>
        <h3>Notes ergonomiques</h3>
        ${notesHtml}
      </div>
    </div>

    <div class="legend">
      <h2 style="margin:0 0 10px 0;border:0;padding:0;font-size:14px;">Code couleur (palette LP Mini MK3)</h2>
      <dl>
        <dt><span class="swatch" style="background:${C.green}"></span>Vert</dt><dd>Duplicate / action active / note playing</dd>
        <dt><span class="swatch" style="background:${C.red}"></span>Rouge</dt><dd>Delete</dd>
        <dt><span class="swatch" style="background:${C.blue}"></span>Bleu</dt><dd>Move / pitch grid</dd>
        <dt><span class="swatch" style="background:${C.yellow}"></span>Jaune</dt><dd>Color cycle / Duplicate Page</dd>
        <dt><span class="swatch" style="background:${C.orange}"></span>Orange</dt><dd>Stop All / Grid mode active</dd>
        <dt><span class="swatch" style="background:${C.amber}"></span>Ambre</dt><dd>Drum mode / Selected pad / Sequencer shift</dd>
        <dt><span class="swatch" style="background:${C.purple}"></span>Violet</dt><dd>Double Loop / Chromatic</dd>
        <dt><span class="swatch" style="background:${C.aqua}"></span>Aqua</dt><dd>Quantize / Cycle loop / Shift session</dd>
        <dt><span class="swatch" style="background:${C.white}"></span>Blanc</dt><dd>Undo / source captured / selected option</dd>
        <dt><span class="swatch" style="background:${C.lightBlue}"></span>LightBlue</dt><dd>Inside loop (page / step picker)</dd>
      </dl>
    </div>

    <div class="ergo-notes">
      <h2>Observations ergonomiques globales</h2>
      <ol>
        <li><strong>Duplicate dupliqué</strong> — la fonction "duplicate page" existe à 2 endroits : slot 2 (modifier dédié) ET dans Special Shift slot 6 (mode duplicate + tap page). <em>Proposition</em> : virer slot 2.</li>
        <li><strong>Slot 7 reserved inerte</strong> en sequencer modes. <em>Candidats</em> : Note Repeat, Accent, Metronome toggle, Tap Tempo.</li>
        <li><strong>Capture + Quantize</strong> sont des actions rares (slots 0/1). Pourraient descendre pour libérer les positions prime.</li>
        <li><strong>3 "shifts" verticalement adjacents</strong> (slots 5, 6, 7). Slot 6 est un shift modal (tap = cycle mode, hold = action). Renommer "Action Shift" mentalement aiderait.</li>
        <li><strong>Special Shift cycle UX</strong> : tap rapide = cycle delete↔duplicate, mais pas de status bar. <em>À ajouter</em> : event bus → show_message.</li>
        <li><strong>Top controls cachés en special shift</strong> : ergo OK mais perd les repères. Pourrait fader ou rester visibles si vraiment besoin (peu utile en pratique).</li>
        <li><strong>Source duplicate row</strong> : pas encore de blink (juste bright vs half). Améliorable.</li>
        <li><strong>Edit mode slots 5/6 inerts</strong> — candidats pour New Scene, Stop All Clips on selected track, etc.</li>
        <li><strong>Pas d'undo/redo en melodic</strong> via arrows (vs drum). Inconsistance.</li>
        <li><strong>AMBER vs YELLOW vs ORANGE</strong> visuellement proches — risque de confusion. À tester sur device.</li>
        <li><strong>Pas de feedback "session copy en cours"</strong> — le geste shift+tap clip n'a aucun indicator visuel d'armed-copy. Beginner-unfriendly vs Edit mode qui montre clairement les modifiers.</li>
      </ol>
    </div>
  `;
}

// ============================================================================
// Build sidebar
// ============================================================================
function buildSidebar() {
  const list = document.getElementById('modeList');
  MODE_GROUPS.forEach(group => {
    const div = document.createElement('div');
    div.className = 'mode-group';
    div.innerHTML = `<div class="group-title">${group.title}</div>`;
    group.modes.forEach(m => {
      const btn = document.createElement('button');
      btn.className = 'mode-btn' + (m.disabled ? ' disabled' : '');
      btn.dataset.mode = m.key;
      btn.innerHTML = `${m.label}<span class="sub">${m.sub}</span>`;
      btn.onclick = () => {
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderMode(m.key);
      };
      div.appendChild(btn);
    });
    list.appendChild(div);
  });
}

buildSidebar();
// Default mode on load
const defaultMode = 'drum-base';
document.querySelector(`.mode-btn[data-mode="${defaultMode}"]`).classList.add('active');
renderMode(defaultMode);
</script>
</body>
</html>
