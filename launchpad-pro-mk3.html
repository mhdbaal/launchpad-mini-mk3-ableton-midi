<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Launchpad Pro MK3 — Layout &amp; fonctionnalités</title>
<style>
  :root {
    --bg:#15171a; --panel:#1f2226; --panel2:#262a2f;
    --border:#2e3338; --border-hi:#4a5158;
    --text:#d6dadd; --dim:#8a939a; --hi:#ffffff;
    --accent:#5dd39e; --accent-bg:#1a3a2e;
    --warn:#f1c40f; --danger:#e63946; --link:#7fb6ea;
  }
  *{box-sizing:border-box}
  body{font:14px/1.55 -apple-system,"Segoe UI",system-ui,sans-serif;
       background:var(--bg);color:var(--text);margin:0}
  a{color:var(--link)}
  h1,h2,h3,h4{color:var(--hi)}
  code,kbd{background:#0e1014;color:#c2e0ff;padding:1px 6px;border-radius:3px;
           font:12px/1.4 "SF Mono",Menlo,Consolas,monospace}
  kbd{border:1px solid var(--border-hi)}

  .app{display:grid;grid-template-columns:270px 1fr;min-height:100vh}
  @media (max-width:900px){.app{grid-template-columns:1fr}
    .sidebar{position:static!important;height:auto!important}}

  /* Sidebar */
  .sidebar{background:var(--panel);border-right:1px solid var(--border);
           padding:18px 0;overflow-y:auto;position:sticky;top:0;height:100vh}
  .brand{padding:0 18px 16px;border-bottom:1px solid var(--border);margin-bottom:14px}
  .brand h1{font-size:15px;margin:0}
  .brand p{margin:4px 0 0;font-size:11.5px;color:var(--dim)}
  .group-title{padding:10px 18px 4px;font-size:11px;color:var(--dim);
               text-transform:uppercase;letter-spacing:.7px;font-weight:600}
  .mode-btn{display:block;width:100%;text-align:left;background:transparent;border:0;
            color:var(--text);padding:6px 18px 6px 26px;cursor:pointer;font:inherit;
            border-left:3px solid transparent}
  .mode-btn:hover{background:var(--panel2)}
  .mode-btn.active{background:var(--accent-bg);color:var(--hi);
                   border-left-color:var(--accent);font-weight:600}
  .mode-btn .sub{display:block;font-size:10.5px;color:var(--dim);margin-top:1px;font-weight:400}

  /* Main */
  .main{padding:28px 36px 70px;max-width:1180px;min-width:0}
  .main h1{margin:0 0 2px;font-size:23px}
  .crumb{color:var(--dim);font-size:12.5px;margin-bottom:14px}
  .activation{background:var(--panel);padding:11px 14px;border-radius:6px;
              border-left:3px solid var(--accent);margin:0 0 16px}
  .row{display:grid;grid-template-columns:auto minmax(320px,1fr);gap:30px;align-items:start}
  @media (max-width:1150px){.row{grid-template-columns:1fr}}

  /* Launchpad */
  .lp-wrap{background:#0a0c0e;padding:14px;border-radius:16px;
           border:1px solid var(--border);width:max-content}
  .lp{display:grid;grid-template-columns:repeat(10,42px);
      grid-template-rows:repeat(11,42px);gap:4px}
  .pad{width:42px;height:42px;display:flex;align-items:center;justify-content:center;
       font-size:8.5px;line-height:1.08;font-weight:700;border-radius:5px;
       border:1px solid rgba(255,255,255,.07);position:relative;text-align:center;
       padding:2px;user-select:none;overflow:visible}
  .pad.round{border-radius:50%}
  .pad.empty{background:transparent!important;border:none}
  .pad[data-tip]:hover{outline:2px solid var(--accent);outline-offset:1px;z-index:20}
  .pad[data-tip]:hover::after{content:attr(data-tip);position:absolute;bottom:118%;
       left:50%;transform:translateX(-50%);background:#05070a;color:#fff;padding:7px 10px;
       border-radius:5px;font-size:11px;font-weight:400;line-height:1.4;z-index:30;
       border:1px solid var(--border-hi);min-width:150px;max-width:300px;
       box-shadow:0 4px 14px rgba(0,0,0,.7);pointer-events:none;text-align:left}
  .lp-caption{color:var(--dim);font-size:11.5px;margin-top:10px;text-align:center;
              max-width:470px}

  /* Info */
  .info h3{margin:22px 0 8px;font-size:12.5px;text-transform:uppercase;letter-spacing:.8px;
           color:var(--dim);border-bottom:1px solid var(--border);padding-bottom:6px}
  .info h3:first-child{margin-top:0}
  .info p{margin:7px 0}
  .info ul{padding-left:19px;margin:7px 0}
  .info li{margin:5px 0}
  .tbl{background:var(--panel);border-radius:6px;border:1px solid var(--border);overflow:hidden}
  .tbl table{width:100%;border-collapse:collapse;font-size:13px}
  .tbl th,.tbl td{padding:7px 11px;text-align:left;border-bottom:1px solid var(--border);
                  vertical-align:top}
  .tbl th{background:var(--panel2);color:var(--hi);font-weight:600;font-size:11.5px;
          text-transform:uppercase;letter-spacing:.5px}
  .tbl tr:last-child td{border-bottom:none}
  .tbl td:first-child{white-space:nowrap;color:var(--accent);font-weight:600;
                      font-family:"SF Mono",Menlo,monospace;font-size:12px}
  .note{background:rgba(241,196,15,.07);border-left:3px solid var(--warn);
        padding:9px 13px;border-radius:0 5px 5px 0;margin:10px 0;font-size:13px}
  .note strong{color:var(--warn)}
  .legend{background:var(--panel);border-radius:6px;border:1px solid var(--border);
          padding:12px 15px;margin-top:14px;max-width:470px}
  .legend div{display:flex;align-items:center;gap:8px;font-size:12px;margin:5px 0;color:var(--dim)}
  .sw{width:13px;height:13px;border-radius:3px;flex:0 0 13px;
      border:1px solid rgba(255,255,255,.14)}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <h1>Launchpad Pro MK3</h1>
      <p>Script custom — layout &amp; modes<br>Ableton Live 12 · Programmer mode</p>
    </div>
    <nav id="nav"></nav>
  </aside>
  <main class="main" id="main"></main>
</div>

<script>
/* =========================================================================
   Palette (approximations HTML des index firmware Launchpad 0-127)
   ====================================================================== */
const C = {
  off:'#16181a', grey:'#2f3338', greyDim:'#1f2327',
  white:'#ffffff', whiteHalf:'#5a5a5a',
  red:'#e63946', redHalf:'#4a1f22',
  orange:'#e67e22', orangeHalf:'#5a3818',
  amber:'#ffbf00', amberHalf:'#5a4400',
  yellow:'#f1c40f', yellowHalf:'#5a4a08',
  green:'#2ecc71', greenHalf:'#1a5a32',
  mint:'#7be0c0', cyan:'#13c4d4',
  blue:'#3498db', blueHalf:'#1c3a5a',
  purple:'#9b59b6', purpleHalf:'#3a1c4a',
  clip:'#3d6b8f', clipDim:'#22404f',
  pink:'#e0559a',
};

/* =========================================================================
   Géométrie physique du Launchpad Pro MK3
   (confirmée : script usine décompilé Launchpad_Pro_MK3/elements.py
    + Programmer's Reference Novation)

   Grille 10 colonnes x 11 lignes :
     ligne 0  : [90 Shift] [91..98 rangée du haut]        (col 9 vide)
     lignes 1-8: [col. gauche] [pads 8x8] [scene launch]
     ligne 9  : rangée track select   CC 101-108
     ligne 10 : rangée track control  CC 1-8
   ====================================================================== */
const TOP    = [[91,'←'],[92,'→'],[93,'Session'],[94,'Note'],[95,'Chord'],
                [96,'Custom'],[97,'Sequen.'],[98,'Projects']];
const LEFT   = [[80,'↑'],[70,'↓'],[60,'Clear'],[50,'Dupl.'],[40,'Quant.'],
                [30,'Fixed L.'],[20,'Play'],[10,'Rec']];
const SCENES = [89,79,69,59,49,39,29,19];
const TRK    = [101,102,103,104,105,106,107,108];
const FN     = [[1,'Rec Arm'],[2,'Mute'],[3,'Solo'],[4,'Volume'],[5,'Pan'],
                [6,'Sends'],[7,'Device'],[8,'Stop Clip']];

/* ------------------------------------------------------------------ utils */
const P = (c,l,t)=>({c,l,t});
function fillGrid(o,fn){for(let y=0;y<8;y++)for(let x=0;x<8;x++){
  const v=fn(x,y); if(v) o['g'+x+y]=v;}}
function rangeGrid(o,x0,x1,y0,y1,fn){for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
  const v=fn(x,y); if(v) o['g'+x+y]=v;}}

/* ---------------------------------------------------- socles de rendu LED */
// Boutons inertes sur toutes les pages (consommés par le background, LED off).
function inert(o){
  o.t94=P(C.off,'Note','Réservé — consommé par le script, LED éteinte. N\'ouvre aucune page firmware.');
  o.t95=P(C.off,'Chord','Réservé — consommé par le script, LED éteinte.');
  o.t96=P(C.off,'Custom','Réservé — consommé par le script, LED éteinte.');
  o.t98=P(C.off,'Projects','Réservé — inerte (INERT_BUTTON_CCS).');
  o.l30=P(C.off,'Fixed L.','Réservé — inerte (INERT_BUTTON_CCS).');
  ['f3','f4','f5','f6'].forEach((k,i)=>{
    o[k]=P(C.off,FN[i+3][1],'Inerte en v1 — les button faders exigent le layout Fader du mode DAW.');
  });
  return o;
}
// Transport + Shift : identiques dans tous les modes.
function transport(o){
  o.t90=P(C.whiteHalf,'Shift','CC 90 — modificateur pur (maintien). Aucun tap, aucun double-tap, aucun lock.');
  o.l20=P(C.green,'Play','CC 20 — Play / Stop du morceau. Actif dans TOUS les modes.');
  o.l10=P(C.red,'Rec','CC 10 — Session Record. Shift+Rec = Capture MIDI. Actif dans TOUS les modes.');
  return o;
}

/* ---------------------------------------------------- socle mode Session */
function sessionBase(){
  const o={};
  inert(o); transport(o);
  o.t91=P(C.greyDim,'←','Session navigation — banque de pistes vers la gauche (LED éteinte en Session).');
  o.t92=P(C.greyDim,'→','Session navigation — banque de pistes vers la droite (LED éteinte en Session).');
  o.t93=P(C.green,'Session','Mode courant. Double-clic = Session Overview.');
  o.t97=P(C.grey,'Sequen.','CC 97 — maintenir = sélecteur de mode sur la colonne scene. Tap simple = séquenceur drum.');
  o.l80=P(C.greyDim,'↑','Session navigation — banque de scènes vers le haut (LED éteinte en Session).');
  o.l70=P(C.greyDim,'↓','Session navigation — banque de scènes vers le bas (LED éteinte en Session).');
  o.l60=P(C.redHalf,'Clear','CC 60 — modificateur Delete (maintien). Clear est prioritaire sur Duplicate.');
  o.l50=P(C.greenHalf,'Dupl.','CC 50 — modificateur Duplicate (maintien).');
  o.l40=P(C.off,'Quant.','Éteint en Session : la quantification de clip n\'est pas encore assignée (réservé v1).');
  fillGrid(o,()=>P(C.clip,'Clip','Clip launch 8x8. Toutes les rangées restent des clips : la rangée mixer vit sous la grille.'));
  SCENES.forEach((cc,i)=>o['s'+i]=P(C.amberHalf,'Scene','Scene launch (CC '+cc+').'));
  TRK.forEach((cc,i)=>o['k'+i]=P(C.whiteHalf,'Trk '+(i+1),'Track select (CC '+cc+') — mode « track_select » par défaut : sélectionne la piste, 2e appui = arm (exclusive_arm respecté).'));
  o.f0=P(C.redHalf,'Rec Arm','CC 1 — bascule la rangée en mode Arm. Shift+Rec Arm = Undo.');
  o.f1=P(C.amberHalf,'Mute','CC 2 — bascule la rangée en mode Mute. Shift+Mute = Redo.');
  o.f2=P(C.blueHalf,'Solo','CC 3 — bascule la rangée en mode Solo.');
  o.f7=P(C.whiteHalf,'Stop Clip','CC 8 — bascule la rangée en mode Stop Clip. Shift+Stop Clip = Stop All Clips.');
  return o;
}

/* -------------------------------------------------- socle modes séquenceur */
function seqBase(opts){
  opts = opts||{};
  const o={};
  inert(o); transport(o);
  o.t93=P(opts.pinned?C.blue:C.greenHalf,'Session',
    'Retour au clip launch. Shift+Session = panneau de sélection de mode. Bleu = piste épinglée.');
  o.t97=P(opts.drum?C.amber:C.grey,'Sequen.','Maintenir = sélecteur de mode sur la colonne scene. Tap simple = séquenceur drum.');
  o.l80=P(C.greenHalf,'↑',opts.upTip||'+12 demi-tons.');
  o.l70=P(C.greenHalf,'↓',opts.downTip||'−12 demi-tons.');
  o.t91=P(C.mint,'←',opts.leftTip||'−1 demi-ton.');
  o.t92=P(C.mint,'→',opts.rightTip||'+1 demi-ton.');
  o.l60=opts.actions?P(C.redHalf,'Clear','Modificateur Delete (maintien) — voir la page dédiée.')
                    :P(C.off,'Clear','Éteint : ce composant n\'expose pas set_action_modifier().');
  o.l50=opts.actions?P(C.greenHalf,'Dupl.','Modificateur Duplicate (maintien). Shift+Duplicate = double la boucle.')
                    :P(C.off,'Dupl.','Éteint : ce composant n\'expose ni set_action_modifier() ni double_loop().');
  o.l40=opts.quantize===false
    ?P(C.off,'Quant.','Éteint : le mode Chord n\'expose pas quantize_selected().')
    :P(C.yellowHalf,'Quant.','CC 40 — quantifie la sélection (pas maintenus, sinon portée du pad / clip).');
  TRK.forEach((cc,i)=>o['k'+i]=P(C.off,'','Rangée mixer éteinte et inerte hors du mode Session.'));
  FN.forEach((f,i)=>{if(!o['f'+i]) o['f'+i]=P(C.off,'','Rangée mixer éteinte hors Session — seules les combos Shift restent actives (Undo / Redo / Stop All).');});
  o.f3=P(C.off,'','Inerte.');o.f4=P(C.off,'','Inerte.');o.f5=P(C.off,'','Inerte.');o.f6=P(C.off,'','Inerte.');
  return o;
}

/* -------------------------------------------- helpers grilles séquenceurs */
function drumSelector(o,sel){
  // 4x4 en bas à gauche = 16 sons du Drum Rack, layout clavier de batterie :
  // rangée du bas (y=7) = index 0-3 (graves), rangée du haut (y=4) = 12-15.
  rangeGrid(o,0,3,4,7,(x,y)=>{
    const idx=(7-y)*4+x;
    const isSel = idx===(sel===undefined?0:sel);
    return P(isSel?C.white:C.orangeHalf,'S'+idx,
      'Sélecteur de son '+idx+' — suit visible_drum_pads du Drum Rack quand pitch_offset=0. '+
      'Les cases remplies prennent la couleur du pad Live. Appui = sélection + audition (canal 1).'+
      (isSel?' ● Sélectionné.':''));
  });
}
function pagePads(o){
  rangeGrid(o,4,7,4,7,(x,y)=>{
    const idx=(y-4)*4+(x-4);
    return P(idx===0?C.white:C.blueHalf,'P'+(idx+1),
      'Page '+(idx+1)+' (16 pages de 32 pas). Tap = afficher la page · double-tap (≤0,35 s) = scoper la boucle sur cette page · maintien + autre page = scoper sur la plage.');
  });
}
function gridPads(o){
  const L=['1/4','1/8','1/16','1/32','1/64','1/128','1/256','1/512',
           '1/4t','1/8t','1/16t','1/32t','1/64t','1/128t','1/256t','1/512t'];
  rangeGrid(o,4,7,4,7,(x,y)=>{
    const idx=(y-4)*4+(x-4);
    const tern=idx>=8;
    return P(idx===2?C.white:(tern?C.purple:C.cyan),L[idx],
      'Résolution '+L[idx]+(tern?' (ternaire — GridTernary / violet)':'')+
      '. Les notes existantes ne sont PAS remappées : seul l\'alignement pas→temps change. Pages et boucle se recalculent sur page_length.');
  });
}

/* =========================================================================
   MODES
   ====================================================================== */
const MODES = {};

/* ---------------------------------------------------------- 0. Matériel */
MODES['hardware']={
  group:'Référence', title:'Cartographie matérielle',
  activation:'Layout physique du Launchpad Pro MK3 et numéros MIDI réellement utilisés par le script.',
  desc:[
    'Le Pro MK3 reste en <strong>Programmer mode</strong> pendant toute la session logicielle : le script écrit les LED directement (Note On canal 0 pour les pads, CC canal 0 pour les boutons) et aucune page firmware n\'est ouverte.',
    'Les pads sont des notes 11–88 (dizaine = rangée, unité = colonne). Tous les boutons périphériques sont des <strong>Control Change canal 0</strong>, identiques en entrée (appui) et en sortie (LED).',
    'Deux rangées existent sous la grille — c\'est la particularité du Pro face au Mini : <strong>track select</strong> (CC 101-108) puis <strong>track control</strong> (CC 1-8).'
  ],
  gestures:[
    ['CC 90','Shift — coin haut-gauche'],
    ['CC 91-98','Rangée du haut : ← → Session Note Chord Custom Sequencer Projects'],
    ['CC 80,70','↑ ↓ (colonne de gauche, rangées 8 et 7)'],
    ['CC 60,50,40,30','Clear · Duplicate · Quantise · Fixed Length'],
    ['CC 20,10','Play · Record'],
    ['CC 89…19','Scene launch, colonne de droite, de haut en bas'],
    ['CC 101-108','Rangée track select (sous la grille)'],
    ['CC 1-8','Rangée track control : Rec Arm, Mute, Solo, Volume, Pan, Sends, Device, Stop Clip'],
    ['Notes 11-88','Grille 8x8 (LED en index palette brut 0-127)'],
  ],
  notes:[
    'Ports MIDI : lier <strong>LPProMK3 MIDI</strong>, <strong>première paire</strong>, en entrée et en sortie. <code>MIDIIN3 / MIDIOUT3</code> est l\'interface DAW du script usine — s\'y lier laisse l\'appareil éteint et fait fuiter les notes des pads dans les pistes.',
    'Une seule surface pour cet appareil : <strong>Launchpad Pro MK3 Custom</strong>. Passer tout slot usine <code>Launchpad Pro MK3</code> à <strong>None</strong> (sans supprimer les fichiers du script usine).',
    'Volume / Pan / Sends / Device et Fixed Length / Projects sont volontairement inertes en v1 — LED éteintes, appuis avalés par le background.'
  ],
  cells(){
    const o={};
    o.t90=P(C.white,'Shift','CC 90');
    TOP.forEach(([cc,l])=>o['t'+cc]=P(C.blueHalf,l,'CC '+cc));
    LEFT.forEach(([cc,l])=>o['l'+cc]=P(C.purpleHalf,l,'CC '+cc));
    SCENES.forEach((cc,i)=>o['s'+i]=P(C.amberHalf,'CC '+cc,'Scene launch '+(i+1)+' — CC '+cc));
    TRK.forEach((cc,i)=>o['k'+i]=P(C.greenHalf,''+cc,'Track select '+(i+1)+' — CC '+cc));
    FN.forEach(([cc,l],i)=>o['f'+i]=P(C.orangeHalf,l,'CC '+cc+' — '+l));
    fillGrid(o,(x,y)=>{
      const note=(8-y)*10+(x+1);
      return P(C.clipDim,''+note,'Pad note '+note+' — dizaine = rangée (8 en haut), unité = colonne.');
    });
    return o;
  }
};

/* ---------------------------------------------------------- 1. Session */
MODES['session']={
  group:'Session', title:'Session — Track Select (défaut)',
  activation:'État de démarrage, et retour par le bouton <strong>Session</strong> (CC 93) depuis n\'importe quel mode.',
  desc:[
    'La grille 8x8 entière est le <strong>clip launch</strong> — contrairement au Mini, aucune rangée n\'est sacrifiée : les fonctions mixer vivent sur les deux rangées sous la grille.',
    'Les 8 scene launch lancent les scènes. Les flèches naviguent la session ring (← → pistes, ↑ ↓ scènes) via le Layer standard ; leurs LED restent éteintes en Session, c\'est volontaire (elles ne s\'allument qu\'en mode séquenceur où elles changent de fonction).',
    'La rangée <strong>track select</strong> (CC 101-108) est pilotée par un <code>ModesComponent</code> : appuyer sur Rec Arm / Mute / Solo / Stop Clip bascule ce que fait la rangée ; ré-appuyer sur la fonction active revient à « track select ».'
  ],
  gestures:[
    ['Pad','Lance le clip.'],
    ['Scene launch','Lance la scène.'],
    ['Track select','Sélectionne la piste ; 2e appui sur la piste déjà sélectionnée = toggle arm (honore <code>song.exclusive_arm</code>).'],
    ['Rec Arm / Mute / Solo / Stop Clip','Bascule la rangée track select vers Arm / Mute / Solo / Stop. Ré-appui = retour à track select.'],
    ['Session ×2','Session Overview (la grille devient la vue d\'ensemble des pages).'],
    ['Shift + Session','Ouvre le panneau de sélection de mode.'],
    ['Sequencer','Ouvre directement le séquenceur drum.'],
    ['Play / Rec','Play-Stop · Session Record. Shift+Rec = Capture MIDI (niveau morceau ici).'],
    ['Shift + Rec Arm / Mute','Undo · Redo (fonctionnent dans tous les modes).'],
    ['Shift + Stop Clip','Stop All Clips.'],
  ],
  notes:['Quantise est éteint en Session : la quantification de clip n\'est pas encore assignée (réservée pour une version ultérieure).'],
  cells:sessionBase
};

MODES['session-mixer']={
  group:'Session', title:'Session — rangée mixer (Arm / Mute / Solo / Stop)',
  activation:'Appuyer sur <strong>Rec Arm</strong>, <strong>Mute</strong>, <strong>Solo</strong> ou <strong>Stop Clip</strong> (CC 1/2/3/8) en mode Session.',
  desc:[
    'Exemple illustré : mode <strong>Mute</strong> actif. La rangée CC 101-108 change de rôle, la grille et les scene launch ne bougent pas.',
    'Le bouton de fonction actif passe en pleine intensité, les autres restent à mi-intensité. Ré-appuyer dessus ramène la rangée à « track select ».',
    'Hors mode Session, toute la rangée mixer est éteinte et inerte — seules les combos Shift (Undo / Redo / Stop All Clips) continuent de répondre.'
  ],
  gestures:[
    ['Rec Arm','Rangée = arm des pistes.'],
    ['Mute','Rangée = mute des pistes.'],
    ['Solo','Rangée = solo des pistes.'],
    ['Stop Clip','Rangée = stop du clip de chaque piste.'],
    ['Fonction active ×2','Retour à track select.'],
  ],
  cells(){
    const o=sessionBase();
    o.f1=P(C.amber,'Mute','Mode actif — pleine intensité.');
    TRK.forEach((cc,i)=>o['k'+i]=P(C.amberHalf,'Mute '+(i+1),'Mute de la piste '+(i+1)+' (CC '+cc+').'));
    return o;
  }
};

MODES['session-shift']={
  group:'Session', title:'Session — Shift maintenu (copier / coller)',
  activation:'Maintenir <strong>Shift</strong> (CC 90) en mode Session.',
  desc:[
    'Shift est un modificateur pur sur le Pro : pas de tap, pas de double-tap, pas de lock — toute la gymnastique du Mini disparaît puisque le bouton est physique.',
    'Le presse-papier clip et le presse-papier scène sont <strong>vidés au relâchement</strong> de Shift.',
    'Copie de clip : 1er tap = source, 2e tap = destination (<code>duplicate_clip_to</code>, validation audio/MIDI). Copie de scène : insère une nouvelle scène à l\'index cible, duplique les slots non vides et recopie nom, couleur, tempo et signature.'
  ],
  gestures:[
    ['Shift + pad','Copier / coller un clip.'],
    ['Shift + scene','Copier / coller une scène.'],
    ['Shift + Session','Panneau de sélection de mode.'],
    ['Shift + Rec','Capture MIDI.'],
    ['Shift + Rec Arm','Undo.'],
    ['Shift + Mute','Redo.'],
    ['Shift + Stop Clip','Stop All Clips.'],
    ['Relâcher Shift','Vide les deux presse-papiers.'],
  ],
  cells(){
    const o=sessionBase();

  'hardware':'notes, CC, ports MIDI','session':'clip launch + rangée mixer',
  'session-mixer':'Arm / Mute / Solo / Stop','session-shift':'copier / coller',

function lum(hex){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return (0.299*r+0.587*g+0.114*b)/255;
}
function padEl(cell,round){
  const d=document.createElement('div');
  d.className='pad'+(round?' round':'');
  if(!cell){d.className+=' empty';return d;}
  d.style.background=cell.c;
  d.style.color=lum(cell.c)>0.55?'rgba(0,0,0,.78)':'rgba(255,255,255,.86)';
  if(cell.c===C.off||cell.c===C.greyDim) d.style.color='#4a5056';
  d.textContent=cell.l||'';
  if(cell.t) d.dataset.tip=cell.t;
  return d;
}
function renderLP(cells){
  const wrap=document.createElement('div');wrap.className='lp-wrap';
  const lp=document.createElement('div');lp.className='lp';
  const at=(k)=>cells[k];
  // ligne 0
  lp.appendChild(padEl(at('t90'),true));
  TOP.forEach(([cc])=>lp.appendChild(padEl(at('t'+cc),true)));
  lp.appendChild(padEl(null));
  // lignes 1-8
  for(let y=0;y<8;y++){
    lp.appendChild(padEl(at('l'+LEFT[y][0]),true));
    for(let x=0;x<8;x++) lp.appendChild(padEl(at('g'+x+y),false));
    lp.appendChild(padEl(at('s'+y),true));
  }
  // ligne 9 — track select
  lp.appendChild(padEl(null));
  for(let i=0;i<8;i++) lp.appendChild(padEl(at('k'+i),true));
  lp.appendChild(padEl(null));
  // ligne 10 — track control
  lp.appendChild(padEl(null));
  for(let i=0;i<8;i++) lp.appendChild(padEl(at('f'+i),true));
  lp.appendChild(padEl(null));
  wrap.appendChild(lp);
  const cap=document.createElement('div');cap.className='lp-caption';
  cap.innerHTML='Survoler un bouton ou un pad pour le détail. Ronds = boutons CC · carrés = pads (notes 11-88).';
  wrap.appendChild(cap);
  return wrap;
}
function renderMode(key){
  const m=MODES[key];const main=document.getElementById('main');
  main.innerHTML='';
  const h=document.createElement('div');
  h.innerHTML='<div class="crumb">'+m.group+'</div><h1>'+m.title+'</h1>'+
              '<div class="activation">'+m.activation+'</div>';
  main.appendChild(h);
  const row=document.createElement('div');row.className='row';
  const left=document.createElement('div');
  left.appendChild(renderLP(m.cells()));
  const lg=document.createElement('div');lg.className='legend';
  lg.innerHTML=
    '<div><span class="sw" style="background:'+C.off+'"></span>LED éteinte — bouton réservé ou inerte dans ce mode</div>'+
    '<div><span class="sw" style="background:'+C.whiteHalf+'"></span>Mi-intensité — disponible</div>'+
    '<div><span class="sw" style="background:'+C.white+'"></span>Pleine intensité — actif / maintenu / sélectionné</div>';
  left.appendChild(lg);
  row.appendChild(left);
  const info=document.createElement('div');info.className='info';
  let html='<h3>Ce que fait ce mode</h3>';
  m.desc.forEach(p=>html+='<p>'+p+'</p>');
  if(m.gestures&&m.gestures.length){
    html+='<h3>Gestes</h3><div class="tbl"><table><thead><tr><th>Geste</th><th>Effet</th></tr></thead><tbody>';
    m.gestures.forEach(([g,d])=>html+='<tr><td>'+g+'</td><td>'+d+'</td></tr>');
    html+='</tbody></table></div>';
  }
  if(m.notes&&m.notes.length){
    html+='<h3>À savoir</h3>';
    m.notes.forEach(n=>html+='<div class="note"><strong>⚠</strong> '+n+'</div>');
  }
  info.innerHTML=html;
  row.appendChild(info);
  main.appendChild(row);
  document.querySelectorAll('.mode-btn').forEach(b=>
    b.classList.toggle('active',b.dataset.key===key));
  location.hash=key;
  main.scrollTop=0;window.scrollTo(0,0);
}
function buildNav(){
  const nav=document.getElementById('nav');let last=null;
  ORDER.forEach(k=>{
    const m=MODES[k];
    if(m.group!==last){
      const g=document.createElement('div');g.className='group-title';g.textContent=m.group;
      nav.appendChild(g);last=m.group;
    }
    const b=document.createElement('button');
    b.className='mode-btn';b.dataset.key=k;
    b.innerHTML=m.title.replace(/^.*— /,'')+'<span class="sub">'+(SUBS[k]||'')+'</span>';
    b.onclick=()=>renderMode(k);
    nav.appendChild(b);
  });
}
buildNav();
renderMode(ORDER.includes(location.hash.slice(1))?location.hash.slice(1):'hardware');
