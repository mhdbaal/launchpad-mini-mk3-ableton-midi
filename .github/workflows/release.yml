name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: python3 -m unittest discover -s tests -v

      - name: Create release zips
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          python3 scripts/build_remote_script.py mini --version "$RELEASE_VERSION"
          python3 scripts/build_remote_script.py pro --version "$RELEASE_VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          body: |
            ## Installation

            1. Download the ZIP for your device (Mini or Pro Custom).
            2. Extract the control-surface folder from the ZIP.
            3. Copy it into `Remote Scripts` in your Ableton User Library.
            4. Restart Ableton Live
            5. Select the corresponding Control Surface and ports (see README).
            6. For Pro Custom, use the first `LPProMK3 MIDI` pair and disable
               the factory Pro surface if it is assigned to the same device.
